name: MJ checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  setup-repair:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        initial-python: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.initial-python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          python -m venv --without-pip .venv
          mkdir -p "$RUNNER_TEMP/mj-no-ensurepip"
          echo 'raise ImportError("ensurepip unavailable in regression test")' > "$RUNNER_TEMP/mj-no-ensurepip/ensurepip.py"
      - run: bash scripts/setup.sh
        env:
          PYTHONPATH: ${{ runner.temp }}/mj-no-ensurepip
      - run: .venv/bin/python -c "import sys; assert sys.version_info[:2] in {(3, 11), (3, 12)}"
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -r requirements.lock
      - run: pip install --no-deps -e .
      - run: ruff check mj tests scripts
      - run: pytest --cov=mj --cov-report=term-missing
      - run: python scripts/native_fuzz.py
  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
